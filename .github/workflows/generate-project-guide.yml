name: Build project explanation PDF

on:
  push:
    branches: [main]
    paths:
      - "docs/project-explanation.md"
      - "scripts/generate_project_guide.py"
      - ".github/workflows/generate-project-guide.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PDF dependency
        run: python -m pip install reportlab
      - name: Generate PDF
        run: python scripts/generate_project_guide.py
      - name: Commit PDF if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/real-time-commerce-streaming-pipeline-explanation.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Add project explanation PDF"
            git push
          else
            echo "PDF is already up to date."
          fi
